title: "DevSecOps Course"
description: "Comprehensive DevSecOps training course with hands-on labs and practical exercises"
baseurl: "/DevSecOps20" # This MUST match your repository name exactly
url: "https://hothaifa96.github.io" # Your GitHub username

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - "**/venv/"
  - "**/__pycache__/"
  - "**/*.pyc"
  - "**/site-packages/"
  - "**/bin/python"
  - "**/bin/activate"
  - "**/pip"
  - "**/pip3"
  - "**/python*"
  - "**/lib/python*/"
  - "**/include/python*/"
  - "**/share/python*/"
  - "**/pyvenv.cfg"

# Include only specific file types for safety
include:
  - "*.md"
  - "*.html"
  - "*.css"
  - "*.js"
  - "*.json"
  - "*.yml"
  - "*.yaml"
  - "*.txt"
  - "*.pdf"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.svg"
  - "*.webp"
